<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&family=Lora:wght@500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="description" content="ConectaLocal: cardápio digital e agendamento online para negócios locais, em um único link." />
    <meta name="theme-color" content="#b45309" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ConectaLocal" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>ConectaLocal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Evita que o cache offline interfira com os módulos sem hash do Vite. -->
    <script>
      if ('serviceWorker' in navigator) {
        if ('%MODE%' === 'development') {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            const appRegistrations = registrations.filter((registration) =>
              [registration.active, registration.waiting, registration.installing].some(
                (worker) => worker?.scriptURL === `${location.origin}/sw.js`
              )
            );
            return Promise.all(appRegistrations.map((registration) => registration.unregister()))
              .then((removed) => {
                if (removed.some(Boolean)) location.reload();
              });
          }).catch((err) => console.error('Failed to unregister the development service worker:', err));
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then(reg => {
              console.log('SW registered:', reg.scope);
              setInterval(() => reg.update(), 60 * 60 * 1000);
            }).catch(err => console.warn('SW registration failed:', err));
          });
        }
      }
    </script>
  </body>
</html>
